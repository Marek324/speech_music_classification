sample_rate = 16000
channels = 1
n_fft = 512

[dataset]
train = "Marek324/speech-music-classification"
eval = "Marek324/speech-music-classification"
stats = "Marek324/speech-music-classification"

[wandb]
project = "Speech Music Classification"
entity = "marek3k-brno-university-of-technology"

[features]
[features.band_energy_ratio]
low = 70
high = 4000

[features.autocorrelation_coefficient]
min_lag_ms = 3
max_lag_ms = 16

[features.spectral_rolloff_point]
threshold = 0.85

[buffers.decision_tree]
frame_length_ms = 20
hop_length_ms = 10
lt_len_ms = 300

[buffers.gmm]
frame_length_ms = 30
hop_length_ms = 15
lt_len_ms = 600

[buffers.svm]
frame_length_ms = 30
hop_length_ms = 15
lt_len_ms = 600

[tcn]
# Preprocessing: resample 22050 Hz mono, Hann STFT (1024, 512), power spectrum,
# 80-band Mel (27.5-8000 Hz), log scale, normalize (precomputed mean/var).
# Stats saved to weights/tcn_preprocess_stats.pt during training.
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
f_min = 27.5
f_max = 8000.0

[tcn.model]
n_filters = 16
kernel_size = 5
n_layers = 4
n_stacks = 3
dropout = 0.3
n_classes = 2
