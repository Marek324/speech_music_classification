# config.toml
# Author: Marek Hric
# Reference TCN configuration

sample_rate = 16000
channels = 1
n_fft = 512

[dataset]
url = "${SMC_DATASET_REPO}"
name = "full"

[features]
[features.band_energy_ratio]
low = 70
high = 4000

[features.autocorrelation_coefficient]
min_lag_ms = 3
max_lag_ms = 16

[features.spectral_rolloff_point]
threshold = 0.85

[buffers.decision_tree]
frame_length_ms = 20
hop_length_ms = 10
lt_len_ms = 300

[buffers.gmm]
sample_rate = 8000
frame_length_ms = 30
hop_length_ms = 15
lt_len_ms = 1000

[buffers.svm]
sample_rate = 8000
frame_length_ms = 30
hop_length_ms = 15
lt_len_ms = 1000

[tcn]
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128

[tcn.model]
n_filters = 16
kernel_size = 5
n_layers = 4
n_stacks = 3
dropout = 0.5
n_classes = 3
use_weight_norm = true
