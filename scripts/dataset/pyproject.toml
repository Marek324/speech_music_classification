[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataset-scripts"
version = "0.1.0"
description = "Dataset building and labeling scripts"
requires-python = ">=3.12"
dependencies = [
    "datasets[audio]>=4.5.0",
    "huggingface-hub>=0.24.0",
    "pyarrow>=18.0.0",
    "pyannote-audio>=4.0.4",
    "pydub>=0.25.1",
    "silero-vad>=6.2.1",
    "soundfile>=0.13.1",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.3",
    "ty>=0.0.19",
]
