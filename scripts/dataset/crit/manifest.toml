# Critical-set recordings - hand-picked test clips that stress the trained
# classifiers. Drop the audio file under recordings/ and add a TOML block here.
#
# Required: file, cls, subclass.
# Labels: either inline `labels = [...]` (hand-curated) OR detector="vad"|"music"|"silence"
#         (run automatic labeler - same code path as the mid/full HF sources).
#         The two are mutually exclusive - exactly one must be set.
#
# All entries are emitted to the test split; no train/validation in this tier.
# Each row in `labels` covers a half-open [start, end) interval in milliseconds.
#
# Sample blocks (delete or replace once real recordings exist):

# [handpicked_clean_speech_01]
# file        = "recordings/handpicked_clean_speech_01.wav"
# cls         = "speech"
# subclass    = "clean"
# source_url  = "https://librivox.org/..."
# license     = "Public Domain"
# notes       = "Studio-quality narration with no background music."
# labels = [
#   { label = "speech", start = 0, end = 12340 },
# ]

# [edge_case_music_under_speech]
# file        = "recordings/edge_case_music_under_speech.flac"
# cls         = "speech"
# subclass    = "noisy"
# detector    = "vad"
# notes       = "Faint background music - challenging for the music head."

[music_jumpup]
file     = "sources/music/jumpup.mp3"
cls      = "music"
subclass = "extreme"
notes    = "Hardcore jumpup - distorted percussion + vocal samples; OOD vs FMA training distribution."
labels = [
  { label = "music", start = 0, end = 220021 },
]

[music_speedcore]
file     = "sources/music/speedcore.mp3"
cls      = "music"
subclass = "extreme"
notes    = "Speedcore - extreme BPM + heavy distortion that surfaces as broadband noise on log-mel."
labels = [
  { label = "music", start = 0, end = 221161 },
]

[music_beatbox]
file     = "recordings/beatbox.wav"
cls      = "music"
subclass = "beatbox"
notes    = "Beatbox - vocal-only 'music' with intermittent spoken-word breaks; pure timbre is human voice (mouth percussion, chest tones, vocal samples), so a frame-level classifier has to switch between music and speech without any instrumental scaffolding to anchor on."
