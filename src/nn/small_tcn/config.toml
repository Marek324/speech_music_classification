# SmallTCN config — small-footprint TCN aimed at matching the production

[tcn]
name = "small"
frontend = "log_mel_delta2"
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
n_mfcc = 20
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128
batch_size = 32
augment = true
loss = "bce_with_logits"

[tcn.model]
backbone = "tcn"
preprocessor = "none"
n_filters = 8
kernel_size = 5
n_layers = 4
n_stacks = 3
n_heads = 4
dropout = 0.5
n_classes = 3
use_weight_norm = true
activation = "relu"

[dataset]
url = "Marek324/speech-music-classification"
name = "full"
