# TCN variant registry — consumed by src/nn/variants.py.
#
# Add a new variant: append a [variants.<name>] block with the same shape as the
# two below. No Python edits required — src/nn/variants.py auto-registers the
# CLI group, weight paths, config loader, and module class.
#
# Dataset is NOT defined here; it's inherited from repo-root config.toml[dataset].
# A variant may still override with a [variants.<name>.dataset] block if needed.

[variants.tcn_l]
display_name = "TCN-L"
ui_label     = "TCN-L"
cli_group    = "tcn-l"
group_help   = "TCN-L — delta2 frontend + conv1d preprocessor + TCN + LSTM head (combined-experiment winner)."
weights_stem = "l"
subdir       = "tcn_l"

[variants.tcn_l.tcn]
name = "l"
frontend = "log_mel_delta2"
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
n_mfcc = 20
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128
batch_size = 32
augment = true
loss = "bce_with_logits"

[variants.tcn_l.tcn.model]
backbone = "tcn"
preprocessor = "conv1d"
n_filters = 16
kernel_size = 5
n_layers = 4
n_stacks = 3
n_heads = 4
dropout = 0.5
n_classes = 3
use_weight_norm = true
activation = "relu"
temporal_head = "lstm"
temporal_head_width = 32

[variants.tcn_s]
display_name = "TCN-S"
ui_label     = "TCN-S"
cli_group    = "tcn-s"
group_help   = "TCN-S — small-footprint TCN: log_mel_delta2 + n_filters=8 + n_stacks=1 (RF=121 frames ≤ training seq_len=128)."
weights_stem = "s"
subdir       = "tcn_s"

[variants.tcn_s.tcn]
name = "s"
frontend = "log_mel_delta2"
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
n_mfcc = 20
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128
batch_size = 32
augment = true
loss = "bce_with_logits"

[variants.tcn_s.tcn.model]
backbone = "tcn"
preprocessor = "none"
n_filters = 8
kernel_size = 5
n_layers = 4
n_stacks = 1
n_heads = 4
dropout = 0.5
n_classes = 3
use_weight_norm = true
activation = "relu"
