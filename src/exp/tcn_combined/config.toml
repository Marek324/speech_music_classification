# exp/tcn_combined/config.toml
# Author: Marek Hric
# Combined variants

[tcn]
name = "baseline"   # ref
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128
loss = "bce_with_logits"

[tcn.model]
n_filters = 16
kernel_size = 5
n_layers = 4
n_stacks = 3
dropout = 0.5
n_classes = 3
use_weight_norm = true

[dataset]
url = "${SMC_DATASET_REPO}"
name = "full"


# -- Variants ------------------------------

# Reference (no overrides)
[tcn.variants.baseline]

# F + P
[tcn.variants.delta2_conv1d]
frontend = "log_mel_delta2"
preprocessor = "conv1d"

# F + A
[tcn.variants.delta2_large]
frontend = "log_mel_delta2"
n_filters = 32

# P + A
[tcn.variants.conv1d_large]
preprocessor = "conv1d"
n_filters = 32

# F + P + A
[tcn.variants.delta2_conv1d_large]
frontend = "log_mel_delta2"
preprocessor = "conv1d"
n_filters = 32
