# exp/nn_preprocessor/config.toml
# Author: Marek Hric
# Learned preprocessor

[tcn]
name = "baseline"   # ref
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128
loss = "bce_with_logits"
frontend = "log_mel_delta2"

[tcn.model]
n_filters = 16
kernel_size = 5
n_layers = 4
n_stacks = 3
dropout = 0.5
n_classes = 3
use_weight_norm = true

[dataset]
url = "${SMC_DATASET_REPO}"
name = "full"


# -- Variants ------------------------------

# Baseline (no preprocessor)
[tcn.variants.baseline]

# 1-D conv preprocessor
[tcn.variants.conv1d]
preprocessor = "conv1d"

# 2-D conv preprocessor
[tcn.variants.conv2d]
preprocessor = "conv2d"
