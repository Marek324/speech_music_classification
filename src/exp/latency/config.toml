[latency]
# Models to benchmark, in run order. Classics first means classics' load_ms
# is measured before torch is touched at all (load_ms for the first NN model
# is then dominated by weight load alone, since _prewarm_torch handles the
# one-time torch + safetensors import).
models = ["decision_tree", "gmm", "svm", "small_tcn", "tcn", "tcn_lstm"]

# Trial structure
warmup_pushes = 10
trials = 5
pushes_per_trial = 200

# Input synthesis (random Gaussian noise scaled to ±input_scale)
seed = 0
input_scale = 0.3

# Torch intra-op thread count. Default torch is 4 on this CPU, but sklearn
# classic models are effectively single-threaded — so the default favours
# NN models. Pin to 1 for an apples-to-apples comparison; raise to compare
# with the multi-threaded torch behaviour the demo would actually see.
torch_threads = 1

# Between-model cleanup — extra wallclock to keep peak RSS bounded by
# max(model) instead of sum(model).
cleanup_gc_passes = 3
cleanup_sleep_s = 0.5
