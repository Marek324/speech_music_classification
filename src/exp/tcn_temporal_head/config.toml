# exp/tcn_temporal_head/config.toml
# Author: Marek Hric
# Temporal head

[tcn]
name = "baseline"   # delta2_conv1d
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128
loss = "bce_with_logits"
frontend = "log_mel_delta2"

[tcn.model]
n_filters = 16
kernel_size = 5
n_layers = 4
n_stacks = 3
dropout = 0.5
n_classes = 3
use_weight_norm = true
preprocessor = "conv1d"

[dataset]
url = "${SMC_DATASET_REPO}"
name = "full"


# -- Variants ------------------------------

# F+P base (no head)
[tcn.variants.baseline]

# GRU (F=32)
[tcn.variants.tcn_gru]
temporal_head = "gru"
temporal_head_width = 32

# GRU wide (F=64)
[tcn.variants.tcn_gru_wide]
temporal_head = "gru"
temporal_head_width = 64

# LSTM (F=32)
[tcn.variants.tcn_lstm]
temporal_head = "lstm"
temporal_head_width = 32

# Causal attention
[tcn.variants.tcn_attn]
temporal_head = "attn"
temporal_head_width = 32
n_heads = 4
