# Marek Hric
# Temporal-head experiment — stacks a stateful head module on top of the TCN.
# Base stack inherits the combined-experiment winner (delta2 frontend + conv1d
# preprocessor + TCN f=16). Each variant adds one head module and tests whether
# it beats the pure-TCN baseline.
# All logic lives in src/nn/tcn/ and src/nn/temporal_heads.py; this file only
# defines variant overrides.

[tcn]
name = "baseline"
# Base recipe = delta2_conv1d from tcn_combined experiment.
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128
loss = "bce_with_logits"
frontend = "log_mel_delta2"

[tcn.model]
n_filters = 16
kernel_size = 5
n_layers = 4
n_stacks = 3
dropout = 0.5
n_classes = 3
use_weight_norm = true
preprocessor = "conv1d"

[dataset]
url = "Marek324/speech-music-classification"
name = "full"

# -- Temporal-head variants ---------------------------------------------------
# Each entry overrides only what it tests; everything else = baseline above.
# All heads are strictly causal.

[tcn.variants.baseline]
# No head — reference = delta2_conv1d.

[tcn.variants.tcn_gru]
temporal_head = "gru"
temporal_head_width = 32          # ~5K added params

[tcn.variants.tcn_gru_wide]
temporal_head = "gru"
temporal_head_width = 64          # ~16K added params

[tcn.variants.tcn_lstm]
temporal_head = "lstm"
temporal_head_width = 32          # ~6K added params

[tcn.variants.tcn_attn]
temporal_head = "attn"
temporal_head_width = 32          # attn dim = 32, ffn = 64
n_heads = 4              # ~7K added params
