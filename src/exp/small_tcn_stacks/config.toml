# Marek Hric
# SmallTCN stacks sweep — receptive-field curve at fixed SmallTCN recipe
# (log_mel_delta2 + no preprocessor + no tail, n_filters=8, SGD + WeightNorm,
# full tier). Isolates n_stacks as the single free axis so we can read off
# the F1-vs-RF tradeoff directly. All logic lives in src/nn/tcn/; this file
# only defines variant overrides.
#
# Receptive field per variant (frames = 1 + n_stacks·n_layers·2·(k−1)):
#   stacks_1 → 121 frames ≈ 2810 ms (≤ training chunk seq_len = 128)
#   stacks_2 → 241 frames ≈ 5596 ms
#   stacks_3 → 361 frames ≈ 8382 ms (current SmallTCN)

[tcn]
name = "baseline"
frontend = "log_mel_delta2"
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
n_mfcc = 20
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128
batch_size = 32
augment = true
loss = "bce_with_logits"

[tcn.model]
backbone = "tcn"
preprocessor = "none"
n_filters = 8
kernel_size = 5
n_layers = 4
n_stacks = 3
n_heads = 4
dropout = 0.5
n_classes = 3
use_weight_norm = true
activation = "relu"

[dataset]
url = "Marek324/speech-music-classification"
name = "full"

# -- Stacks variants ----------------------------------------------------------
# Each entry overrides only n_stacks; everything else = SmallTCN baseline.
# stacks_3 reproduces the deployed SmallTCN recipe and serves as an
# in-experiment seed-noise reference point.

[tcn.variants.stacks_1]
n_stacks = 1

[tcn.variants.stacks_2]
n_stacks = 2

[tcn.variants.stacks_3]
n_stacks = 3
