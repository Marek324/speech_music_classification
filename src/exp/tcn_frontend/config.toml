# Marek Hric
# TCN frontend experiment — tests alternative audio feature representations.
# All logic lives in src/nn/tcn/; this file only defines variant overrides.

[tcn]
name = "baseline"
# Baseline uses same frontend as production: log_mel, 80 bands.
# Training recipe matches the ablation baseline (SGD, WeightNorm).
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128
loss = "bce_with_logits"

[tcn.model]
n_filters = 16
kernel_size = 5
n_layers = 4
n_stacks = 3
dropout = 0.5
n_classes = 3
use_weight_norm = true

[dataset]
url = "Marek324/speech-music-classification"
name = "full"

# ── Frontend variants ───��─────────────────────────────────────────────────────
# Each entry overrides only what it tests; everything else = baseline above.

# Frequency resolution — how many mel bands the TCN sees.
[tcn.variants.baseline]

[tcn.variants.log_mel_40]
n_mels = 40

[tcn.variants.log_mel_128]
n_mels = 128

# Temporal derivatives — explicit Δ/ΔΔ features alongside log-mel.
[tcn.variants.log_mel_delta]
frontend = "log_mel_delta"       # mel + Δ → 160 features

[tcn.variants.log_mel_delta2]
frontend = "log_mel_delta2"      # mel + Δ + ΔΔ → 240 features

# Decorrelated features — DCT of log-mel, standard in ASR.
# Augmentation disabled: gain shift in MFCC space ≠ waveform gain.
[tcn.variants.mfcc_20]
frontend = "mfcc"
n_mfcc = 20
augment = false

[tcn.variants.mfcc_40]
frontend = "mfcc"
n_mfcc = 40
augment = false

# Adaptive normalization — PCEN replaces log + z-norm (Wang et al. 2017).
# Augmentation disabled: PCEN's adaptive gain control makes additive
# shift non-equivalent to waveform gain.
[tcn.variants.pcen]
frontend = "pcen"
augment = false
