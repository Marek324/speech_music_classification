# Marek Hric

[tcn]
name = "baseline"
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3              # paper does not specify an initial LR; 1e-2 crashed most ablations
                       # via the WeightNorm ‖v‖→0 pathway — see [tcn.ablations.optimizer.sgd_lr_1e-2]
seq_len = 128
loss = "bce_with_logits"  # numerically stable; [tcn.ablations.loss.bce_sigmoid] reverts to paper-literal BCE(sigmoid(x))

[tcn.model]
n_filters = 16          # paper search space: 8, 16, 32
kernel_size = 5         # paper search space: 3, 5, 7, ..., 19
n_layers = 4            # paper search space: 1–4
n_stacks = 3            # paper search space: 3–10
dropout = 0.5           # paper search space: 0.05–0.5
n_classes = 3
use_weight_norm = true

[dataset]
url = "Marek324/speech-music-classification"
name = "full"

# ── Ablation subgroups ────────────────────────────────────────────────────────
# Each entry overrides only what it tests; everything else = baseline above.

# loss function — tested but no signal: all variants land within ±0.0003 of baseline.
# [tcn.ablations.loss.baseline]
# [tcn.ablations.loss.bce_sigmoid]
# loss = "bce"                 # reverts to nn.BCELoss(sigmoid(x)); expected to DIVERGE (CUDA assert)
# [tcn.ablations.loss.focal]
# loss = "focal"               # focal BCE, gamma=2 — downweights easy frames
# [tcn.ablations.loss.weighted_bce]
# loss = "weighted_bce"        # BCEWithLogits with per-class pos_weight (inactive rare)
# [tcn.ablations.loss.mse]
# loss = "mse"                 # MSE on sigmoid(logits) — classical regression baseline
# [tcn.ablations.loss.label_smoothing]
# loss = "label_smoothing_bce" # BCEWithLogits with target smoothing 0.1

# optimizer/normalization: paper choices vs our production choices
[tcn.ablations.optimizer.baseline]
[tcn.ablations.optimizer.adam]
optimizer = "adam"
lr = 1e-3
[tcn.ablations.optimizer.batch_norm]
use_weight_norm = false
[tcn.ablations.optimizer.adam_batchnorm]
optimizer = "adam"
lr = 1e-3
use_weight_norm = false
[tcn.ablations.optimizer.sgd_batchnorm]
use_weight_norm = false     # SGD + BatchNorm — completes 2×2 factorial
[tcn.ablations.optimizer.sgd_lr_1e-2]
lr = 1e-2                   # paper-adjacent LR; SGD+WeightNorm is knife-edge at this LR — expected to DIVERGE

# capacity: number of filters — tested but no signal: filters_8/32 within ±0.001 of baseline.
# [tcn.ablations.capacity.baseline]
# [tcn.ablations.capacity.filters_8]
# n_filters = 8
# [tcn.ablations.capacity.filters_32]
# n_filters = 32

# n_layers: how many dilated conv layers per stack
# RF = n_stacks × (sum 2^i for i in 0..n_layers-1) × (kernel_size-1) + 1
# baseline: 3 × 15 × 4 + 1 = 181 frames
[tcn.ablations.layers.baseline]
[tcn.ablations.layers.layers_1]
n_layers = 1            # RF = 3×1×4+1 = 13 frames (paper minimum)
[tcn.ablations.layers.layers_2]
n_layers = 2            # RF = 3×3×4+1 = 37 frames
[tcn.ablations.layers.layers_3]
n_layers = 3            # RF = 3×7×4+1 = 85 frames

# n_stacks — tested but no signal: stacks_5 within 0.001 of baseline.
# [tcn.ablations.stacks.baseline]
# [tcn.ablations.stacks.stacks_5]
# n_stacks = 5            # RF = 5×15×4+1 = 301 frames

# kernel_size — tested but no signal: kernel_3/7/9 within ±0.003 of baseline.
# [tcn.ablations.kernel.baseline]
# [tcn.ablations.kernel.kernel_3]
# kernel_size = 3         # RF = 3×15×2+1 = 91 frames (paper minimum)
# [tcn.ablations.kernel.kernel_7]
# kernel_size = 7         # RF = 3×15×6+1 = 271 frames
# [tcn.ablations.kernel.kernel_9]
# kernel_size = 9         # RF = 3×15×8+1 = 361 frames

# regularization: dropout
[tcn.ablations.regularization.baseline]
[tcn.ablations.regularization.dropout_low]
dropout = 0.1
[tcn.ablations.regularization.dropout_medium]
dropout = 0.25

# training: chunk length — tested but no signal: seq_len 256/270 within ±0.002 of baseline.
# [tcn.ablations.training.baseline]
# [tcn.ablations.training.seq_len_256]
# seq_len = 256           # chunks now exceed full RF (181 frames)
# [tcn.ablations.training.seq_len_270]
# seq_len = 270           # paper's original value; just above full RF (181 frames)

# skip connections: paper hyperparameter (Table 2)
[tcn.ablations.skip_connections.baseline]
[tcn.ablations.skip_connections.no_skip]
skip_connections = false  # removes residual add; plain dilated conv stack

# activation function
[tcn.ablations.activation.baseline]
[tcn.ablations.activation.leaky_relu]
activation = "leaky_relu"
[tcn.ablations.activation.elu]
activation = "elu"
[tcn.ablations.activation.gelu]
activation = "gelu"

# feature resolution: number of mel filterbanks
# DIVERGED — cached preprocess stats are hardcoded at 80 mels; needs separate stats per count.
# [tcn.ablations.n_mels.baseline]
# [tcn.ablations.n_mels.mels_40]
# n_mels = 40
# [tcn.ablations.n_mels.mels_128]
# n_mels = 128

# training batch size — tested but no signal: batch_16/64 within ±0.002 of baseline.
# [tcn.ablations.batch_size.baseline]
# [tcn.ablations.batch_size.batch_16]
# batch_size = 16
# [tcn.ablations.batch_size.batch_64]
# batch_size = 64

# data augmentation (gain ±6dB) — tested but no signal: no_augment within 0.001 of baseline.
# [tcn.ablations.augmentation.baseline]
# [tcn.ablations.augmentation.no_augment]
# augment = false

# ── Coordinate-ascent search order ───────────────────────────────────────────
# Loss and optimizer/normalization are settled first so capacity/depth choices
# train under a stable numerical recipe.
[tcn.coord_ascent]
subgroup_order = [
    "optimizer", "layers", "activation", "regularization", "skip_connections",
]
