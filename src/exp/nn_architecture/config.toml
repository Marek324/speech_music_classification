# Marek Hric
# Backbone architecture experiment — tests alternative causal sequence models.
# All logic lives in src/nn/tcn/; this file only defines variant overrides.

[tcn]
name = "baseline"
# Baseline uses same training recipe as ablation baseline.
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128
loss = "bce_with_logits"

[tcn.model]
n_filters = 16
kernel_size = 5
n_layers = 4
n_stacks = 3
dropout = 0.5
n_classes = 3
use_weight_norm = true

[dataset]
url = "Marek324/speech-music-classification"
name = "full"

# -- Backbone variants --------------------------------------------------------
# Each entry overrides only what it tests; everything else = baseline above.
# All architectures are strictly causal (no future lookahead).
#
# Capacity sweep across two param budgets (~32K, ~128K) so each backbone is
# compared at comparable capacity rather than at a fixed hidden size. Hidden
# sizes chosen so param counts land within ~10% of each budget; see PR notes
# for arithmetic.

[tcn.variants.baseline]
# TCN small — f=16, ~32K params. Matches ablation baseline.

[tcn.variants.tcn_large]
n_filters = 32           # ~126K params

[tcn.variants.gru_small]
backbone = "gru"
n_filters = 32           # ~28K params

[tcn.variants.gru_large]
backbone = "gru"
n_filters = 72           # ~132K params

[tcn.variants.lstm_small]
backbone = "lstm"
n_filters = 32           # ~36K params

[tcn.variants.lstm_large]
backbone = "lstm"
n_filters = 64           # ~138K params

[tcn.variants.transformer_small]
backbone = "transformer"
n_filters = 24
n_heads = 4              # head_dim = 6; ~31K params

[tcn.variants.transformer_large]
backbone = "transformer"
n_filters = 48
n_heads = 8              # head_dim = 6; ~117K params
