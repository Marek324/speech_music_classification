# Transition analysis on the switching recordings of the critical set.
#
# Reads `_scores.npz` files written by `smclassifier exp critical eval` and
# extracts the switching clips (subclass starts with `speech_switching_`),
# bucketed into 2-class (speech↔music) and 3-class (speech↔music↔background)
# variants at four cadences. Two metrics:
#   1. transition latency  — ms from each GT label change to the first frame
#      where the model's prediction matches the new GT label. Capped at the
#      next GT change; misses reported separately.
#   2. stable-region flicker — prediction changes per second inside stable GT
#      segments, excluding `flicker_settle_ms` after each change so the
#      settling transient doesn't masquerade as flicker.

[transitions]
# Source of `_scores.npz` files. Default: critical-set results, which is
# where the switching clips live. Path is repo-root-relative if not absolute.
scores_dir = "src/exp/critical/results"

# Models to analyse, in display order. NN family first, then classic baselines.
models = ["tcn", "tcn_l", "tcn_s", "decision_tree", "gmm", "svm"]

# Per-model frame periods (ms). Mirror of `[critical.frame_ms]` — duplicated
# here so the analysis is self-contained.
[transitions.frame_ms]
tcn = 23.219954648526077          # 1000 * 512 / 22050
tcn_l = 23.219954648526077
tcn_s = 23.219954648526077
decision_tree = 10.0
gmm = 15.0
svm = 15.0

[transitions.metrics]
# Cadences (ms) to break the report down by. Each value must correspond to a
# `speech_switching_<cad>ms` (and/or `_3class_<cad>ms`) subclass.
cadences_ms = [500, 1000, 2000, 4000]

# Frames within this margin after a GT change are excluded from flicker
# counting — they're "settling" transients, not stable-region flicker.
flicker_settle_ms = 200
