# Switch-latency experiment.
#
# Streams the crit-set switching clips (subclass `switching_*` and
# `switching_3class_*`) through every front-of-pipeline classifier in
# `models`, with a silence prefill so each clip starts from a saturated +
# settled buffer state. For every ground-truth class change inside the clip,
# the analysis records the smallest `k` such that the streamed prediction
# matches the new class for `consecutive_match` consecutive hops; the latency
# is `k * hop_ms`. Misses (no flip before the next GT change) are tracked
# separately and excluded from the median.
#
# Inputs are the local switching wavs at `manifest_dir/recordings/<key>.wav`
# plus the per-clip labels embedded in `manifest_dir/manifest.toml`. The HF
# crit upload is not used — the wavs are the canonical source.

[switch_latency]
# Models to evaluate. Order is preserved in the report.
models = ["decision_tree", "gmm", "svm", "tcn", "tcn_s", "tcn_l"]

# Path to the crit manifest directory (relative to repo root). The
# experiment reads `manifest.toml` for clip definitions and resolves wav
# paths from there.
manifest_dir = "scripts/dataset/crit"

# Cadences (ms) to include. Each must correspond to a `switching_<cad>ms_v*`
# or `switching_3class_<cad>ms_v*` family in the manifest.
cadences_ms = [500, 1000, 2000, 4000]

# How long to push silence (zeros) into each runner before streaming the
# clip, so feature buffers (≤ 1 s) and smoothing buffers (≤ ~1 s) are
# saturated and the measurement starts from a settled state.
silence_prefill_ms = 1500

# A transition is "flipped" once the streamed prediction matches the new
# GT class for this many consecutive hops. K=3 suppresses single-hop
# flicker without inflating latency meaningfully.
consecutive_match = 3
