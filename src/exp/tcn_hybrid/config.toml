# Marek Hric
# Hybrid-backbone experiment — stacks a stateful tail module on top of the TCN.
# Base stack inherits the combined-experiment winner (delta2 frontend + conv1d
# preprocessor + TCN f=16). Each variant adds one tail module and tests whether
# it beats the pure-TCN baseline.
# All logic lives in src/nn/tcn/ and src/nn/hybrids.py; this file only defines
# variant overrides.

[tcn]
name = "baseline"
# Base recipe = delta2_conv1d from tcn_combined experiment.
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128
loss = "bce_with_logits"
frontend = "log_mel_delta2"

[tcn.model]
n_filters = 16
kernel_size = 5
n_layers = 4
n_stacks = 3
dropout = 0.5
n_classes = 3
use_weight_norm = true
preprocessor = "conv1d"

[dataset]
url = "Marek324/speech-music-classification"
name = "full"

# -- Tail variants ------------------------------------------------------------
# Each entry overrides only what it tests; everything else = baseline above.
# All tails are strictly causal.

[tcn.variants.baseline]
# No tail — reference = delta2_conv1d.

[tcn.variants.tcn_gru]
tail = "gru"
tail_width = 32          # ~9K added params

[tcn.variants.tcn_gru_wide]
tail = "gru"
tail_width = 64          # ~25K added params

[tcn.variants.tcn_lstm]
tail = "lstm"
tail_width = 32          # ~12K added params

[tcn.variants.tcn_attn]
tail = "attn"
tail_width = 32          # attn dim = 32, ffn = 64
n_heads = 4              # ~20K added params

[tcn.variants.tcn_two_branch]
tail = "two_branch"
tail_width = 16          # parallel branch filters = 16, ~30K added params
