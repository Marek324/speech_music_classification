# scripts/dataset/crit/manifest.toml
# Author: Marek Hric
# Critical subset recordings

[music_jumpup]
file     = "sources/music/jumpup.mp3"
cls      = "music"
subclass = "extreme"
notes    = "Hardcore jumpup - distorted percussion + vocal samples; OOD vs FMA training distribution."
labels = [
  { label = "music", start = 0, end = 220021 },
]

[music_speedcore]
file     = "sources/music/speedcore.mp3"
cls      = "music"
subclass = "extreme"
notes    = "Speedcore - extreme BPM + heavy distortion that surfaces as broadband noise on log-mel."
labels = [
  { label = "music", start = 0, end = 221161 },
]

[music_beatbox]
file     = "recordings/beatbox.wav"
cls      = "music"
subclass = "beatbox"
notes    = "Beatbox - vocal-only 'music' with intermittent spoken-word breaks; pure timbre is human voice (mouth percussion, chest tones, vocal samples), so a frame-level classifier has to switch between music and speech without any instrumental scaffolding to anchor on."
