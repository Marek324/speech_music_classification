[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "click==8.3.1",
    "datasets[audio]==4.6.1",
    "huggingface-hub==1.5.0",
    "joblib==1.5.3",
    "librosa==0.11.0",
    "matplotlib==3.10.8",
    "numpy==2.2.6",
    "psutil==7.2.2",
    "pyannote-audio==4.0.4",
    "pyarrow==23.0.1",
    "pydub==0.25.1",
    "reflex==0.9.0",
    "safetensors==0.7.0",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "silero-vad==6.2.1",
    "soundfile==0.13.1",
    "sounddevice==0.5.5",
    "tomli==2.4.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
    "tqdm==4.67.3",
]

[project.scripts]
smclassifier = "src.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchcodec = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

