# Critical subset check

[critical]
models = ["decision_tree", "gmm", "svm", "tcn", "tcn_s", "tcn_l"]

[critical.dataset]
url = "scripts/dataset/speech_music_dataset/crit"
name = "crit"

[critical.frame_ms]
tcn = 23.22
tcn_s = 23.22
tcn_l = 23.22
decision_tree = 10.0
gmm = 15.0
svm = 15.0

[critical.viz]
panel_seconds = 15.0
max_panels_per_file = 32
inches_per_second = 0.60
level_height = 0.18
