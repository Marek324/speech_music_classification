# exp/tcn_frontend/config.toml
# Author: Marek Hric
# Spectral frontend

[tcn]
name = "baseline"   # ref
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128
loss = "bce_with_logits"

[tcn.model]
n_filters = 16
kernel_size = 5
n_layers = 4
n_stacks = 3
dropout = 0.5
n_classes = 3
use_weight_norm = true

[dataset]
url = "Marek324/speech-music-classification"
name = "full"


# -- Variants ------------------------------

# Baseline (log-mel 80)
[tcn.variants.baseline]

# log-mel 40
[tcn.variants.log_mel_40]
n_mels = 40

# log-mel 128
[tcn.variants.log_mel_128]
n_mels = 128

# Δ
[tcn.variants.log_mel_delta]
frontend = "log_mel_delta"

# Δ²
[tcn.variants.log_mel_delta2]
frontend = "log_mel_delta2"

# MFCC 20
[tcn.variants.mfcc_20]
frontend = "mfcc"
n_mfcc = 20
augment = false

# MFCC 40
[tcn.variants.mfcc_40]
frontend = "mfcc"
n_mfcc = 40
augment = false

# PCEN
[tcn.variants.pcen]
frontend = "pcen"
augment = false
