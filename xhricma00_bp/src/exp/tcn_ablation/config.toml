# exp/tcn_ablation/config.toml
# Author: Marek Hric
# Sensitivity analysis and ablation

[tcn]
name = "baseline"   # ref
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128
loss = "bce_with_logits"

[tcn.model]
n_filters = 16
kernel_size = 5
n_layers = 4
n_stacks = 3
dropout = 0.5
n_classes = 3
use_weight_norm = true

[dataset]
url = "Marek324/speech-music-classification"
name = "full"


# -- Variants ------------------------------

# Baseline (optimizer)
[tcn.ablations.optimizer.baseline]

# Adam
[tcn.ablations.optimizer.adam]
optimizer = "adam"
lr = 1e-3

# BatchNorm
[tcn.ablations.optimizer.batch_norm]
use_weight_norm = false

# Adam + BatchNorm
[tcn.ablations.optimizer.adam_batchnorm]
optimizer = "adam"
lr = 1e-3
use_weight_norm = false

# SGD, LR = 1e-2
[tcn.ablations.optimizer.sgd_lr_1e-2]
lr = 1e-2

# Baseline (layers)
[tcn.ablations.layers.baseline]

# 1 layer
[tcn.ablations.layers.layers_1]
n_layers = 1

# 2 layers
[tcn.ablations.layers.layers_2]
n_layers = 2

# 3 layers
[tcn.ablations.layers.layers_3]
n_layers = 3

# Baseline (regularization)
[tcn.ablations.regularization.baseline]

# Dropout = 0.1
[tcn.ablations.regularization.dropout_low]
dropout = 0.1

# Dropout = 0.25
[tcn.ablations.regularization.dropout_medium]
dropout = 0.25

# Baseline (skip connections)
[tcn.ablations.skip_connections.baseline]

# No skip connections
[tcn.ablations.skip_connections.no_skip]
skip_connections = false

# Baseline (activation)
[tcn.ablations.activation.baseline]

# LeakyReLU
[tcn.ablations.activation.leaky_relu]
activation = "leaky_relu"

# ELU
[tcn.ablations.activation.elu]
activation = "elu"

# GeLU
[tcn.ablations.activation.gelu]
activation = "gelu"


[tcn.coord_ascent]
subgroup_order = [
    "optimizer", "layers", "activation", "regularization", "skip_connections",
]
