# exp/nn_architecture/config.toml
# Author: Marek Hric
# Alternative backbones

[tcn]
name = "baseline"   # ref
sample_rate = 22050
n_fft = 1024
hop_length = 512
n_mels = 80
f_min = 27.5
f_max = 8000.0
optimizer = "sgd"
lr = 1e-3
seq_len = 128
loss = "bce_with_logits"

[tcn.model]
n_filters = 16
kernel_size = 5
n_layers = 4
n_stacks = 3
dropout = 0.5
n_classes = 3
use_weight_norm = true

[dataset]
url = "Marek324/speech-music-classification"
name = "full"


# -- Variants ------------------------------

# TCN small (F=16, reference)
[tcn.variants.baseline]

# TCN large (F=32)
[tcn.variants.tcn_large]
n_filters = 32

# GRU small (F=32)
[tcn.variants.gru_small]
backbone = "gru"
n_filters = 32

# GRU large (F=72)
[tcn.variants.gru_large]
backbone = "gru"
n_filters = 72

# LSTM small (F=32)
[tcn.variants.lstm_small]
backbone = "lstm"
n_filters = 32

# LSTM large (F=64)
[tcn.variants.lstm_large]
backbone = "lstm"
n_filters = 64

# Transformer small (F=24)
[tcn.variants.transformer_small]
backbone = "transformer"
n_filters = 24
n_heads = 4

# Transformer large (F=48)
[tcn.variants.transformer_large]
backbone = "transformer"
n_filters = 48
n_heads = 8
