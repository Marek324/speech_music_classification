[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "click>=8.3.1",
    "datasets[audio]>=4.5.0",
    "huggingface-hub>=0.24.0",
    "joblib>=1.5.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pyannote-audio>=4.0.4",
    "pyarrow>=18.0.0",
    "pydub>=0.25.1",
    "reflex>=0.6",
    "safetensors>=0.4.0",
    "silero-vad>=6.2.1",
    "soundfile>=0.13.1",
    "sounddevice>=0.4.6",
    "tomli>=2.4.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
    "tqdm>=4.67.0",
    "wandb>=0.16.0",
    "psutil>=7.2.2",
]

[project.scripts]
smclassifier = "src.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchcodec = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.3",
    "ty>=0.0.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
